    # BEGIN kinetics-ask (managed by deploy/install-ask.sh in kinetics-mis-demo; edit there)
    # TEMPLATE: __ASK_SOCK__ is rendered to the repo's own run/ask.sock by the installer.
    location = /api/ask {
        limit_except POST { deny all; }
        proxy_pass http://unix:__ASK_SOCK__:/ask;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store";
    }
    location = /api/ask/health {
        limit_except GET { deny all; }
        proxy_pass http://unix:__ASK_SOCK__:/health;
        proxy_http_version 1.1;
        add_header Cache-Control "no-store";
    }
    # END kinetics-ask
